# bluejay ships an Android 16 vendor (ro.vendor.build.version.sdk = 36), but the
# rootfs is the generic halium-arm64 one, whose /etc/gbinder.conf is generated
# from GBINDER_API_LEVEL:halium-arm64 = "32".
#
# 32 resolves to libgbinder's API-31 preset, because the presets are matched in
# descending order and 32 is below 33: that gives the aidl3 ServiceManager and
# the aidl4 protocol. Android 16 needs the API-36 preset - the aidl6
# ServiceManager, with the protocol back at aidl3 (33 reverted it). With the
# wrong ServiceManager nothing AIDL resolves a service name at all.
#
# libgbinder reads /etc/gbinder.d/*.conf after /etc/gbinder.conf and merges them
# over it, then applies the preset for the resulting ApiLevel - so setting it
# here overrides the generic value without touching the shared file, and without
# changing gbinder for any other halium-arm64 device.
#
# Listing ApiLevel rather than spelling out [ServiceManager] and [Protocol] by
# hand keeps this correct if libgbinder's own idea of API 36 ever changes.
[General]
ApiLevel = 36
